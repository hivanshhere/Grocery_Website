<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef6f1;
            --card: #ffffff;
            --text: #18221b;
            --muted: rgba(24, 34, 27, 0.68);
            --accent: #27ae60;
            --accent-dark: #158146;
            --border: rgba(39, 174, 96, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 12% 12%, rgba(39, 174, 96, 0.12), transparent 28%),
                linear-gradient(180deg, #f7fbf8 0%, var(--bg) 100%);
            color: var(--text);
        }

        .card {
            width: min(92vw, 640px);
            padding: 40px 28px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.14);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin-bottom: 18px;
            border-radius: 18px;
            background: rgba(39, 174, 96, 0.12);
            color: var(--accent-dark);
            font-size: 34px;
            font-weight: 700;
            box-shadow: 0 0 0 8px rgba(39, 174, 96, 0.06);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
        }

        p {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .order-label {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            background: #eef8f1;
            color: var(--accent-dark);
            font-weight: 700;
            border: 1px solid rgba(39, 174, 96, 0.16);
        }

        .actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .actions a {
            text-decoration: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .actions a:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }

        .primary {
            background: var(--accent);
            color: white;
        }

        .primary:hover {
            background: #219150;
        }

        .secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">&#10003;</div>
        <h1>Your Order has been Placed</h1>
        <p>Your order was placed successfully and is now being processed.</p>
        <div id="orderStatus" class="order-label">Order placed</div>
        <div class="actions">
            <a class="primary" href="stores.html">Continue Shopping</a>
            <a class="secondary" href="index.html">Go to Home</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("order_id") || localStorage.getItem("lastOrderId");
        const statusEl = document.getElementById("orderStatus");

        if (orderId && statusEl) {
            statusEl.textContent = `Order placed successfully. Order ID: ${orderId}`;
        }

        localStorage.removeItem("lastOrderId");
    </script>
</body>
</html>
